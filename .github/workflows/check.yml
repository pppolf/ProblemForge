name: Affected checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Git revision to compare
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PF_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
      DATABASE_URL: postgresql://check:check@127.0.0.1/check
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.11.1}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: node scripts/ci.mjs
